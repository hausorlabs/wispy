<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wispy - Closing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Instrument Sans',-apple-system,sans-serif;background:#0B0F1A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 40px;overflow:hidden;position:relative}

    /* Subtle grid */
    body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#1E293B 1px,transparent 1px);background-size:40px 40px;opacity:0.4}

    .scene{width:780px;text-align:center;position:relative;z-index:1}
    @keyframes fadeIn{to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Results bar */
    .results{display:flex;justify-content:center;gap:14px;margin-bottom:40px;opacity:0;animation:fadeIn .6s ease forwards .3s}
    .result-pill{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(27,196,125,0.1);border:1px solid rgba(27,196,125,0.3);border-radius:10px;font-size:13px;font-weight:600;color:#1BC47D}
    .result-pill i{font-size:16px}
    .result-pill.stat{background:rgba(138,207,234,0.1);border-color:rgba(138,207,234,0.3);color:#8ACFEA}
    .result-pill.gas{background:rgba(255,0,233,0.1);border-color:rgba(255,0,233,0.3);color:#FF00E9}

    /* Logo */
    .logo{margin-bottom:16px;opacity:0;transform:scale(0.5);animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) forwards 1.2s}
    @keyframes logoPop{to{opacity:1;transform:scale(1)}}
    .logo svg{width:80px;height:68px;filter:drop-shadow(0 0 40px rgba(138,207,234,0.3))}

    /* Title */
    .title{font-family:'Instrument Serif',serif;font-size:56px;color:#fff;margin-bottom:12px;opacity:0;animation:slideUp .5s ease forwards 1.8s}

    /* Tagline - typed */
    .tagline-wrap{height:32px;margin-bottom:40px;opacity:0;animation:fadeIn .3s ease forwards 2.5s}
    .tagline{font-size:18px;font-weight:600;color:#FF00E9;display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid #FF00E9;width:0;animation:typeTag 1.5s steps(38) forwards 2.8s,blinkTag .6s step-end 4 2.8s}
    @keyframes typeTag{to{width:380px}}
    @keyframes blinkTag{0%,100%{border-color:#FF00E9}50%{border-color:transparent}}

    /* Protocol pills */
    .protocols{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px;opacity:0;animation:fadeIn .5s ease forwards 4.5s}
    .proto{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid}
    .proto.x402{color:#FF7000;border-color:rgba(255,112,0,0.3);background:rgba(255,112,0,0.08)}
    .proto.ap2{color:#EC4899;border-color:rgba(236,72,153,0.3);background:rgba(236,72,153,0.08)}
    .proto.bite{color:#1BC47D;border-color:rgba(27,196,125,0.3);background:rgba(27,196,125,0.08)}
    .proto.defi{color:#2196F3;border-color:rgba(33,150,243,0.3);background:rgba(33,150,243,0.08)}
    .proto.audit{color:#7C3AED;border-color:rgba(124,58,237,0.3);background:rgba(124,58,237,0.08)}

    /* Team */
    .team{font-size:15px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:20px;opacity:0;animation:slideUp .5s ease forwards 5.2s}

    /* Links row */
    .links{display:flex;justify-content:center;gap:20px;margin-bottom:28px;opacity:0;animation:fadeIn .5s ease forwards 5.8s}
    .link-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#94A3B8}
    .link-item i{font-size:16px}
    .link-item.primary{color:#8ACFEA;font-weight:600}

    /* Install command */
    .install{opacity:0;animation:slideUp .5s ease forwards 6.3s}
    .install-box{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 24px}
    .install-label{font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:0.05em}
    .install-cmd{font-family:'JetBrains Mono','Instrument Sans',monospace;font-size:15px;font-weight:500;color:#8ACFEA}

    /* Hackathon badge */
    .hack-badge{margin-top:24px;opacity:0;transform:scale(0.7);animation:badgePop .5s cubic-bezier(.34,1.56,.64,1) forwards 7s}
    @keyframes badgePop{to{opacity:1;transform:scale(1)}}
    .hack-inner{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;background:rgba(255,0,233,0.08);border:1px solid rgba(255,0,233,0.25)}
    .hack-inner svg{width:16px;height:16px}
    .hack-text{font-size:13px;font-weight:600;color:#FF00E9}

    /* Ambient glow */
    .glow{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(120px);opacity:0.15;pointer-events:none}
    .glow-1{top:-100px;left:-50px;background:#8ACFEA;animation:glowPulse 4s ease-in-out infinite}
    .glow-2{bottom:-100px;right:-50px;background:#FF00E9;animation:glowPulse 4s ease-in-out infinite 2s}
    @keyframes glowPulse{0%,100%{opacity:0.1;transform:scale(1)}50%{opacity:0.2;transform:scale(1.1)}}
  </style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="scene">
  <!-- Results -->
  <div class="results">
    <div class="result-pill"><i class="ti ti-circle-check-filled"></i> 5/5 Tracks PASS</div>
    <div class="result-pill stat"><i class="ti ti-tool"></i> 92+ Tools</div>
    <div class="result-pill gas"><i class="ti ti-gas-station"></i> $0 Gas Fees</div>
  </div>

  <!-- Logo -->
  <div class="logo">
    <svg viewBox="0 0 163 136" fill="#8ACFEA">
      <path d="M61.9 1.3C101.4-6.9 115.1 26.6 115.2 26.7c.1 0 33.3-12.1 44.2 18.4 10.9 30.5-10.9 39.5-11 39.6 0 .1 2.3 24.7-15.3 31.7s-31.7 12.1-31.7 12c-.1.1-14.1 18-37.6 17.6-23.4-.4-31.7-26.5-31.7-26.6-.1 0-31-.1-32.1-29.5C-1.1 47.6 28.5 42.8 28.6 42.8c0-.1-6.2-33.3 33.3-41.5zM68.2 44.4c-6.1 0-11 4.9-11 11v25.1c0 6 4.9 10.9 11 11 6 0 11-4.9 11-11V55.3c0-6-4.9-11-11-11zm27.4 0c-6.1 0-11 4.9-11 11v25.1c0 6 4.9 10.9 11 11 6 0 10.9-4.9 11-11V55.3c0-6-4.9-11-11-11z"/>
    </svg>
  </div>

  <!-- Title -->
  <div class="title">wispy</div>

  <!-- Typed tagline -->
  <div class="tagline-wrap">
    <span class="tagline">Agents that think, act, and transact.</span>
  </div>

  <!-- Protocol pills -->
  <div class="protocols">
    <span class="proto x402">x402 Payments</span>
    <span class="proto ap2">AP2 Protocol</span>
    <span class="proto bite">BITE Encryption</span>
    <span class="proto defi">DeFi Swaps</span>
    <span class="proto audit">Audit Reports</span>
  </div>

  <!-- Team -->
  <div class="team">Built by Brian Mwai & Joy Lang'at</div>

  <!-- Links -->
  <div class="links">
    <div class="link-item primary"><i class="ti ti-world"></i> wispy.cc</div>
    <div class="link-item"><i class="ti ti-book"></i> docs.wispy.cc</div>
    <div class="link-item"><i class="ti ti-brand-github"></i> hausorlabs/wispy</div>
  </div>

  <!-- Install -->
  <div class="install">
    <div class="install-box">
      <span class="install-label">Install</span>
      <span class="install-cmd">npm i -g wispy-ai</span>
    </div>
  </div>

  <!-- Hackathon badge -->
  <div class="hack-badge">
    <div class="hack-inner">
      <svg viewBox="0 0 24 24" fill="#FF00E9"><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>
      <span class="hack-text">Gemini 3 Hackathon | San Francisco</span>
    </div>
  </div>
</div>
</body>
</html>

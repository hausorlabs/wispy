<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wispy - Team Intro</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Instrument Sans',-apple-system,sans-serif;background:linear-gradient(180deg,#8ACFEA 0%,#c5e5f5 50%,#FAFDFF 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 40px}
    .scene{width:740px;text-align:center;opacity:0;animation:fadeIn .6s ease forwards .3s}
    @keyframes fadeIn{to{opacity:1}}

    /* Wispy logo */
    .logo{margin-bottom:28px;opacity:0;transform:scale(0.6);animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) forwards .5s}
    @keyframes logoPop{to{opacity:1;transform:scale(1)}}
    .logo svg{width:100px;height:85px;filter:drop-shadow(0 8px 24px rgba(138,207,234,0.4))}

    /* Title */
    .title{font-family:'Instrument Serif',serif;font-size:42px;color:#1A1A2E;margin-bottom:8px;opacity:0;animation:slideUp .5s ease forwards 1.2s}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    /* Subtitle */
    .subtitle{font-size:16px;color:#64748B;margin-bottom:40px;opacity:0;animation:slideUp .5s ease forwards 1.5s}

    /* Team cards */
    .team{display:flex;justify-content:center;gap:24px;margin-bottom:36px}
    .member{background:#fff;border-radius:18px;padding:24px 32px;box-shadow:0 12px 40px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);min-width:200px;opacity:0;transform:translateY(20px)}
    .member:nth-child(1){animation:slideUp .5s ease forwards 2s}
    .member:nth-child(2){animation:slideUp .5s ease forwards 2.3s}
    .member-avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff}
    .member:nth-child(1) .member-avatar{background:linear-gradient(135deg,#FF00E9,#EC4899)}
    .member:nth-child(2) .member-avatar{background:linear-gradient(135deg,#8ACFEA,#2196F3)}
    .member-name{font-size:16px;font-weight:700;color:#1A1A2E;margin-bottom:2px}
    .member-role{font-size:12.5px;color:#94A3B8}

    /* Hackathon badge */
    .hackathon{opacity:0;transform:scale(0.7);animation:badgePop .5s cubic-bezier(.34,1.56,.64,1) forwards 3s}
    @keyframes badgePop{to{opacity:1;transform:scale(1)}}
    .hack-inner{display:inline-flex;align-items:center;gap:10px;background:#fff;padding:12px 24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.08);border:1.5px solid #e2e8f0}
    .hack-sparkle{font-size:20px}
    .hack-text{font-size:14px;font-weight:600;color:#1A1A2E}
    .hack-text span{color:#FF00E9}
    .hack-location{font-size:12px;color:#94A3B8;margin-left:8px}

    /* Powered by row */
    .powered{margin-top:28px;opacity:0;animation:fadeIn .5s ease forwards 3.5s}
    .powered-row{display:flex;justify-content:center;gap:20px;align-items:center}
    .pw-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#94A3B8}
    .pw-dot{width:4px;height:4px;background:#CBD5E1;border-radius:50%}
    .pw-item i{font-size:16px}
    .pw-gemini{color:#2196F3}
    .pw-skale{color:#1BC47D}
    .pw-npm{color:#FF7000}
  </style>
</head>
<body>
<div class="scene">
  <div class="logo">
    <svg viewBox="0 0 163 136" fill="#8ACFEA">
      <path d="M61.9 1.3C101.4-6.9 115.1 26.6 115.2 26.7c.1 0 33.3-12.1 44.2 18.4 10.9 30.5-10.9 39.5-11 39.6 0 .1 2.3 24.7-15.3 31.7s-31.7 12.1-31.7 12c-.1.1-14.1 18-37.6 17.6-23.4-.4-31.7-26.5-31.7-26.6-.1 0-31-.1-32.1-29.5C-1.1 47.6 28.5 42.8 28.6 42.8c0-.1-6.2-33.3 33.3-41.5zM68.2 44.4c-6.1 0-11 4.9-11 11v25.1c0 6 4.9 10.9 11 11 6 0 11-4.9 11-11V55.3c0-6-4.9-11-11-11zm27.4 0c-6.1 0-11 4.9-11 11v25.1c0 6 4.9 10.9 11 11 6 0 10.9-4.9 11-11V55.3c0-6-4.9-11-11-11z"/>
    </svg>
  </div>

  <div class="title">wispy</div>
  <div class="subtitle">Autonomous AI Agent Platform</div>

  <div class="team">
    <div class="member">
      <div class="member-avatar">BM</div>
      <div class="member-name">Brian Mwai</div>
      <div class="member-role">Co-founder & Lead Engineer</div>
    </div>
    <div class="member">
      <div class="member-avatar">JL</div>
      <div class="member-name">Joy Lang'at</div>
      <div class="member-role">Co-founder & Product</div>
    </div>
  </div>

  <div class="hackathon">
    <div class="hack-inner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#FF00E9"><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>
      <div class="hack-text">Built for the <span>Gemini 3 Hackathon</span></div>
      <span class="hack-location">San Francisco</span>
    </div>
  </div>

  <div class="powered">
    <div class="powered-row">
      <div class="pw-item pw-gemini"><i class="ti ti-sparkles"></i> Gemini 2.5 Pro</div>
      <div class="pw-dot"></div>
      <div class="pw-item pw-skale"><i class="ti ti-link"></i> SKALE BITE V2</div>
      <div class="pw-dot"></div>
      <div class="pw-item pw-npm"><i class="ti ti-package"></i> npm: wispy-ai</div>
      <div class="pw-dot"></div>
      <div class="pw-item" style="color:#EC4899"><i class="ti ti-currency-dollar"></i> x402 Protocol</div>
    </div>
  </div>
</div>
</body>
</html>
